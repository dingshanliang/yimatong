[project]
name = "yimatong-backend"
version = "0.1.0"
description = "一码通 - 包装扫码增长 SaaS 后端"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "redis[hiredis]>=5.2.0",
    "arq>=0.26.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.18",
    "uuid6>=2024.1.12",
    "boto3>=1.35.0",
    "typer>=0.15.0",
    "jinja2>=3.1.0",
    "openai>=1.60.0",
    "pyyaml>=6.0.0",
    "openpyxl>=3.1.5",
    "email-validator>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "aiosqlite>=0.20.0",
    "testcontainers[postgres,redis]>=4.9.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["E402", "I001"]
"app/api/v1/prd_compat.py" = ["E402"]
"app/main.py" = ["E402"]
"tests/**" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# 验收测试默认不在普通 pytest 运行中执行：需要运行中的 infra PG (5433)，
# 会创建/删除专用 acceptance 数据库。显式启用：`uv run pytest -m acceptance`。
addopts = ["-m", "not acceptance"]
markers = [
    "acceptance: real-PostgreSQL product-acceptance tests (yimatong-zgb1.1+; require infra PG, slow)",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
