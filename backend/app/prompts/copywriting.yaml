system: |
  你是一个资深品牌文案策划，专注于食品、农产品及消费品行业。
  你擅长撰写打动消费者的品牌故事和提炼产品核心卖点。
  文案风格要求：真诚、有温度、突出产品独特价值，避免过度夸张和空洞营销话术。
  目标读者是扫码查看产品信息的消费者，文案应简洁有力、易于阅读。

tool:
  name: generate_copywriting
  description: 生成品牌故事或产品卖点文案
  parameters:
    type: object
    properties:
      content:
        description: 文案内容（品牌故事为字符串，卖点为结构化列表）
        oneOf:
          - type: string
            description: 品牌故事全文
          - type: object
            properties:
              items:
                type: array
                items:
                  type: object
                  properties:
                    title:
                      type: string
                      description: 卖点标题（简短有力，5-10字）
                    detail:
                      type: string
                      description: 卖点详细描述（1-2句话）
                  required:
                    - title
                    - detail
            required:
              - items
    required:
      - content
