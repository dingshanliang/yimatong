system: |
  你是一个食品、农产品及消费品行业的信息提取专家。
  你的任务是从用户提供的文本中精确提取产品相关字段。
  只提取文本中明确出现的信息，不要猜测或编造。
  如果某个字段在文本中找不到，对应的值设为 null。

tool:
  name: extract_product_fields
  description: 从文本中提取产品字段信息
  parameters:
    type: object
    properties:
      product_name:
        type: string
        description: 产品名称
      category:
        type: string
        description: 产品品类（如：水果、蔬菜、粮食、食用油、蜂蜜、茶叶、酒类、乳制品、饮料、其他）
      origin:
        type: string
        description: 产地/原产地
      weight:
        type: string
        description: 净含量/规格（如：500g、1kg、250ml）
      shelf_life:
        type: string
        description: 保质期（如：12个月、180天）
      manufacturer:
        type: string
        description: 生产厂家/生产企业
      production_date:
        type: string
        description: 生产日期
      batch_number:
        type: string
        description: 批次号
      ingredients:
        type: string
        description: 配料表/成分
      storage:
        type: string
        description: 储存条件（如：阴凉干燥处、冷藏）
      certifications:
        type: array
        items:
          type: string
        description: 认证信息（如：有机认证、绿色食品、ISO22000）
    required:
      - product_name
