services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: yimatong
      POSTGRES_PASSWORD: yimatong
      POSTGRES_DB: yimatong_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yimatong -d yimatong_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/yimatong --ignore-existing;
      mc mb myminio/yimatong-uploads --ignore-existing;
      mc mb myminio/yimatong-exports --ignore-existing;
      echo 'MinIO buckets created';
      "

  migration:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["uv", "run", "alembic", "upgrade", "head"]
    environment:
      database_url: postgresql+asyncpg://yimatong:yimatong@postgres:5432/yimatong_dev
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv

  db-init:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: yimatong
    command:
      [
        "psql",
        "-h",
        "postgres",
        "-U",
        "yimatong",
        "-d",
        "yimatong_dev",
        "-v",
        "ON_ERROR_STOP=1",
        "-f",
        "/scripts/init_runtime_role.sql",
      ]
    depends_on:
      migration:
        condition: service_completed_successfully
    volumes:
      - ./backend/scripts/init_runtime_role.sql:/scripts/init_runtime_role.sql:ro

  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["uv", "run", "python", "-m", "app.cli", "all"]
    environment:
      database_url: postgresql+asyncpg://yimatong_app:yimatong_app@postgres:5432/yimatong_dev
      control_database_url: postgresql+asyncpg://yimatong:yimatong@postgres:5432/yimatong_dev
      secret_key: dev-secret-key-change-in-production
      AES_MASTER_KEY_V1: f18d81c3b455f9a5a01db6a8546fc5acc242b51cbc4ae70ec99654e091f38a4b
      HMAC_PEPPER: 7c9cade78554566742f263539bd4ff404493e9b9ed6939168da7ad5ceb3813cd
    depends_on:
      db-init:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      database_url: postgresql+asyncpg://yimatong_app:yimatong_app@postgres:5432/yimatong_dev
      control_database_url: postgresql+asyncpg://yimatong:yimatong@postgres:5432/yimatong_dev
      redis_url: redis://redis:6379/0
      secret_key: dev-secret-key-change-in-production
      AES_MASTER_KEY_V1: f18d81c3b455f9a5a01db6a8546fc5acc242b51cbc4ae70ec99654e091f38a4b
      HMAC_PEPPER: 7c9cade78554566742f263539bd4ff404493e9b9ed6939168da7ad5ceb3813cd
      # Next.js H5 runs on the Compose bridge and forwards the browser XFF.
      # Production must set this to its exact ingress/proxy networks.
      minio_endpoint: minio:9000
      minio_access_key: minioadmin
      minio_secret_key: minioadmin
      sms_provider: mock
      sms_api_url: http://mock-sms:3001
      wechat_provider: mock
      wechat_api_url: http://mock-wechat:3002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command:
      [
        "uv",
        "run",
        "python",
        "-c",
        "from app.tasks.worker import run_worker; run_worker()",
      ]
    environment:
      database_url: postgresql+asyncpg://yimatong_app:yimatong_app@postgres:5432/yimatong_dev
      control_database_url: postgresql+asyncpg://yimatong:yimatong@postgres:5432/yimatong_dev
      redis_url: redis://redis:6379/0
      secret_key: dev-secret-key-change-in-production
      AES_MASTER_KEY_V1: f18d81c3b455f9a5a01db6a8546fc5acc242b51cbc4ae70ec99654e091f38a4b
      HMAC_PEPPER: 7c9cade78554566742f263539bd4ff404493e9b9ed6939168da7ad5ceb3813cd
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv

  admin:
    image: node:22-alpine
    working_dir: /app
    restart: unless-stopped
    command:
      [
        "sh",
        "-c",
        "corepack enable && corepack prepare pnpm@10.33.0 --activate && CI=true pnpm install && pnpm dev:admin",
      ]
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ""
      API_PROXY_TARGET: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - admin_node_modules:/app/node_modules
      - admin_app_node_modules:/app/apps/admin/node_modules
      - admin_shared_node_modules:/app/packages/shared/node_modules

  h5:
    image: node:22-alpine
    working_dir: /app
    restart: unless-stopped
    command:
      [
        "sh",
        "-c",
        "corepack enable && corepack prepare pnpm@10.33.0 --activate && CI=true pnpm install && pnpm dev:h5 --port 3001",
      ]
    ports:
      - "3001:3001"
    environment:
      BACKEND_URL: http://backend:8000
      # Browser traffic goes directly to the public API. Next rewrites preserve
      # caller-supplied forwarding headers and must not become a trusted proxy.
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - h5_node_modules:/app/node_modules
      - h5_app_node_modules:/app/apps/h5/node_modules
      - h5_shared_node_modules:/app/packages/shared/node_modules

  mock-sms:
    image: node:22-alpine
    working_dir: /mock
    command:
      [
        "node",
        "-e",
        "const http=require('http');http.createServer((req,res)=>{res.writeHead(200);res.end(JSON.stringify({code:0,msg:'mock ok'}));}).listen(3001,()=>console.log('mock-sms on 3001'));",
      ]
    ports:
      - "3099:3001"

  mock-wechat:
    image: node:22-alpine
    working_dir: /mock
    command:
      [
        "node",
        "-e",
        "const http=require('http');http.createServer((req,res)=>{res.writeHead(200);res.end(JSON.stringify({access_token:'mock_token_123',openid:'mock_openid'}));}).listen(3002,()=>console.log('mock-wechat on 3002'));",
      ]
    ports:
      - "3098:3002"

volumes:
  postgres_data:
  redis_data:
  minio_data:
  backend_venv:
  admin_node_modules:
  admin_app_node_modules:
  admin_shared_node_modules:
  h5_node_modules:
  h5_app_node_modules:
  h5_shared_node_modules:
